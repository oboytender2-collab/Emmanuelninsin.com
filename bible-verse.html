
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Daily Bible Verse from the New World Translation of the Holy Scriptures.">
  <title>Daily Bible Verse | Emmanuel Osei Kojo Ninsin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #263238;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: auto;
      padding: 40px 20px;
      flex: 1;
    }

    h1 {
      text-align: center;
      color: #17365d;
      margin-bottom: 30px;
    }

    .verse-card {
      background: #fff;
      border-radius: 14px;
      padding: 30px 24px;
      text-align: center;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .verse-card h2 {
      color: #17365d;
      margin-top: 0;
    }

    #verse-text {
      font-size: 21px;
      line-height: 1.8;
      margin: 25px 0 12px;
      white-space: pre-line;
    }

    #verse-reference {
      font-weight: bold;
      color: #17365d;
    }

    .source {
      margin-top: 25px;
      font-size: 14px;
      line-height: 1.8;
      color: #555;
    }

    a {
      color: #1558a6;
    }

    .visit-link {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 7px;
      background: #17365d;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      background: #17365d;
      color: white;
      text-align: center;
      padding: 24px 15px;
      line-height: 1.8;
    }

    footer strong {
      font-size: 18px;
    }

    footer p {
      margin: 5px 0;
    }
  </style>
</head>

<body>
  <main>
    <h1>DAILY BIBLE VERSE</h1>

    <section class="verse-card">
      <h2>Bible Verse</h2>

      <p id="verse-text">Loading today’s verse…</p>
      <p id="verse-reference"></p>

      <div class="source">
        New World Translation of the Holy Scriptures<br>
        Source:
        <a href="https://www.jw.org/"
           target="_blank" rel="noopener noreferrer">JW.ORG</a>
      </div>

      <a class="visit-link"
         href="https://www.jw.org/"
         target="_blank" rel="noopener noreferrer">
        Visit JW.ORG
      </a>
    </section>
  </main>

  <footer>
    <strong>Emmanuel Osei Kojo Ninsin</strong>
    <p>Education • Leadership • Justice</p>
    <p>&copy; 2026 Emmanuel Osei Kojo Ninsin. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
